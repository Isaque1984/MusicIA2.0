<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🎵 MusicIA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(680px, 100%);
      background: #121a2d;
      border: 1px solid #263453;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    p {
      color: #aeb8cf;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      background: #0b1020;
      color: #fff;
      border: 1px solid #34415f;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #16834a;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 16px;
      text-align: center;
      white-space: pre-wrap;
      color: #dce5f7;
    }

    audio {
      width: 100%;
      margin-top: 18px;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🎵 MusicIA</h1>

    <p>
      Transforme uma ideia em uma música.
    </p>

    <label for="idea">
      Como você quer sua música?
    </label>

    <textarea
      id="idea"
      placeholder="Ex.: Um homem lutando para vencer na vida e nunca desistir"
    >Um homem lutando para vencer na vida e nunca desistir</textarea>

    <div class="grid">

      <div>
        <label for="style">Estilo</label>

        <select id="style">
          <option>Sertanejo</option>
          <option>Funk</option>
          <option>Trap</option>
          <option>Rap</option>
          <option>Pop</option>
          <option>Rock</option>
          <option>Gospel</option>
          <option>Forró</option>
          <option>MPB</option>
        </select>
      </div>

      <div>
        <label for="mood">Clima</label>

        <select id="mood">
          <option>Motivacional</option>
          <option>Romântico</option>
          <option>Triste</option>
          <option>Alegre</option>
          <option>Sombrio</option>
          <option>Épico</option>
        </select>
      </div>

      <div>
        <label for="voice">Voz</label>

        <select id="voice">
          <option>Masculina</option>
          <option>Feminina</option>
          <option>Dueto</option>
          <option>Instrumental</option>
        </select>
      </div>

    </div>

    <button id="go">
      🎶 Criar música
    </button>

    <div id="status"></div>

    <audio
      id="audio"
      controls
      hidden
    ></audio>

  </div>

<script>

const $ = id => document.getElementById(id);

$("go").onclick = async () => {

  const idea = $("idea").value.trim();

  if (!idea) {
    $("status").textContent =
      "⚠️ Digite uma ideia para a música.";
    return;
  }

  $("go").disabled = true;

  $("status").textContent =
    "⏳ Criando sua música...\nIsso pode levar alguns minutos.";

  $("audio").hidden = true;
  $("audio").removeAttribute("src");

  try {

    const response = await fetch(
      "/api/generate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          idea: idea,
          style: $("style").value,
          mood: $("mood").value,
          voice: $("voice").value
        })
      }
    );

    const contentType =
      response.headers.get("content-type") || "";

    if (contentType.startsWith("audio/")) {

      const blob = await response.blob();

      $("audio").src =
        URL.createObjectURL(blob);

      $("audio").hidden = false;

      $("status").textContent =
        "✅ Música criada!";

    } else {

      const data = await response.json();

      if (!response.ok) {

        throw new Error(
          data.detail || "Erro desconhecido"
        );

      }

      if (!data.audio) {

        throw new Error(
          "A IA não retornou o áudio."
        );

      }

      $("audio").src = data.audio;

      $("audio").hidden = false;

      $("status").textContent =
        "✅ Música criada!";
    }

  } catch (error) {

    $("status").textContent =
      "❌ Não foi possível gerar: " +
      error.message;

  } finally {

    $("go").disabled = false;

  }

};

</script>

</body>
  </html>
